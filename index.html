    <!-- 内联关键CSS：防止antdv CSS-in-JS hydration闪烁 -->
    <style>
      :root{color-scheme:light only}
      .ant-app{width:100%;height:100%}
      .ant-layout{background:#fafafa}
      .ant-layout-header{height:64px;line-height:64px;padding:0;background:#fff!important;border-bottom:1px solid #f0f0f0}
      .ant-layout-content{flex:auto;background:#fafafa}
      .ant-menu{line-height:64px;background:transparent}
      .ant-menu-item{font-size:14px}
      .ant-btn{border-radius:8px}
      .ant-input{border-radius:8px}
      .ant-select-selector{border-radius:8px!important}
      .ant-card{border-radius:8px}
      .ant-modal-content{border-radius:8px}
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Microsoft YaHei',sans-serif;font-size:14px;color:#262626;background:#fafafa}
    </style>
    <script src="//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- busuanzi 数据劫持：在 Vue hydration 之前将统计数据持久化到 sessionStorage -->
    <script>
      (function() {
        var observer = new MutationObserver(function() {
          var pv = document.getElementById('busuanzi_site_pv');
          var uv = document.getElementById('busuanzi_site_uv');
          var pvText = pv && pv.textContent.trim();
          var uvText = uv && uv.textContent.trim();
          if (pvText && pvText !== '0') {
            sessionStorage.setItem('busuanzi_site_pv', pvText);
            window.dispatchEvent(new CustomEvent('busuanzi-updated', { detail: { pv: pvText, uv: uvText } }));
          }
          if (uvText && uvText !== '0') {
            sessionStorage.setItem('busuanzi_site_uv', uvText);
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
